name: Deploy RAMPAGE RUMBLE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'RAMPAGE_RUMBLE_Game_Project.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack game ZIP
        run: |
          mkdir -p site
          unzip -o RAMPAGE_RUMBLE_Game_Project.zip -d unpacked
          if [ -f unpacked/Rampage_Rumble/index.html ]; then
            cp -R unpacked/Rampage_Rumble/. site/
          elif [ -f unpacked/index.html ]; then
            cp -R unpacked/. site/
          else
            echo "Could not find index.html in the game ZIP"
            find unpacked -maxdepth 3 -type f
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
